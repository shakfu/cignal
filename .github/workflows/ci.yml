name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  qa:
    name: QA (lint, typecheck, test)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Install uv
        uses: astral-sh/setup-uv@v10.0.1
        with:
          enable-cache: true

      - name: Set up Python
        run: uv python install 3.13

      - name: Install Pd and SuperCollider
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends puredata-core supercollider-server supercollider-language

      # The host tests skip when a host is missing; fail here instead. Headers come from thirdparty/.
      - name: Check hosts
        run: for host in pd scsynth sclang; do command -v "$host" || exit 1; done

      - name: Install dependencies
        run: uv sync --dev

      - name: Lint with ruff
        run: uv run ruff check src/ tests/

      - name: Check formatting with ruff
        run: uv run ruff format --check src/ tests/

      - name: Type check with mypy
        run: uv run mypy

      - name: Run tests
        run: uv run pytest tests/ -v -rs --cov=src/cignal --cov-report=xml
        env:  # Ubuntu's sclang is the Qt build; these let it start without a display
          QT_QPA_PLATFORM: offscreen
          QTWEBENGINE_DISABLE_SANDBOX: "1"
          QT_QUICK_BACKEND: software
          LIBGL_ALWAYS_SOFTWARE: "1"
          QTWEBENGINE_CHROMIUM_FLAGS: --no-sandbox --disable-gpu

  macos:
    name: macOS (clang, Apple libm)
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v7

      - name: Install uv
        uses: astral-sh/setup-uv@v10.0.1
        with:
          enable-cache: true

      - name: Set up Python
        run: uv python install 3.13

      # The casks install Pd-*.app and SuperCollider.app into /Applications, where cignal looks for them.
      - name: Install Pd and SuperCollider
        run: brew install --cask pd supercollider

      - name: Install dependencies
        run: uv sync --dev

      # The host tests skip when a host is missing; fail here instead.
      - name: Check hosts
        run: |
          uv run python -c "
          from cignal.build import find_pd_binary, find_scsynth
          from pathlib import Path
          sc = find_scsynth()
          found = {'pd': find_pd_binary(), 'scsynth': sc, 'sclang': sc and sc.parent.parent / 'MacOS/sclang'}
          print(found)
          assert all(found.values()) and found['sclang'].is_file(), found
          "

      - name: Run tests
        run: uv run pytest tests/ -v -rs

  # Both layouts of every Array[K, N] kernel (docs/dev/soa.md). Fails only if their outputs differ; the
  # timings go to the job summary, since shared runners are too noisy to gate on.
  layout-bench:
    name: Layout benchmark (${{ matrix.os }}, ${{ matrix.cc }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-latest, cc: gcc }
          - { os: ubuntu-latest, cc: clang }
          - { os: macos-latest, cc: cc }
    steps:
      - uses: actions/checkout@v7

      - name: Install uv
        uses: astral-sh/setup-uv@v10.0.1
        with:
          enable-cache: true

      - name: Set up Python
        run: uv python install 3.13

      - name: Install dependencies
        run: uv sync

      - name: Compare layouts
        env:
          CC: ${{ matrix.cc }}
        run: |
          uv run python bench/layout.py | tee layout.md
          { echo "## ${{ matrix.os }}, ${{ matrix.cc }}"; echo; cat layout.md; } >> "$GITHUB_STEP_SUMMARY"

  build:
    name: Build (${{ matrix.os }}/${{ matrix.python-version }})
    needs: qa
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest]
        python-version: ["3.12", "3.14"]

    steps:
      - uses: actions/checkout@v7

      - name: Install uv
        uses: astral-sh/setup-uv@v10.0.1
        with:
          enable-cache: true

      - name: Set up Python ${{ matrix.python-version }}
        run: uv python install ${{ matrix.python-version }}

      - name: Install dependencies
        run: uv sync

      - name: Build wheel
        run: uv build --wheel

      - name: Run tests
        run: uv run pytest tests/ -v

      - name: Upload wheel artifact
        uses: actions/upload-artifact@v7
        with:
          name: wheel-${{ matrix.os }}-py${{ matrix.python-version }}
          path: dist/*.whl
          retention-days: 7

  collect-artifacts:
    name: Collect all artifacts
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v8
        with:
          path: all-wheels
          pattern: wheel-*
          merge-multiple: true

      - name: List collected wheels
        run: ls -la all-wheels/

      - name: Upload combined artifacts
        uses: actions/upload-artifact@v7
        with:
          name: all-wheels
          path: all-wheels/
          retention-days: 14
