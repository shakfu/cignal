[project]
name = "cignal"
version = "0.1.0"
description = "Compile DSP kernels written in static Python to C99"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [
    { name = "Shakeeb Alireza", email = "shakfu@users.noreply.github.com" }
]
requires-python = ">=3.12"
keywords = ["dsp", "audio", "compiler", "c99", "pure-data", "supercollider"]
# This project intentionally has no runtime dependencies.
dependencies = []
classifiers = [
    "Development Status :: 3 - Alpha",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Programming Language :: Python :: Implementation :: CPython",
    "Typing :: Typed",
]

[project.scripts]
cignal = "cignal.cli:main"

[dependency-groups]
dev = [
    "mypy>=2.4.1",
    "numpy>=2.3",
    "pytest>=9.2.0",
    "pytest-cov>=7.1.0",
    "ruff>=0.17.6",
    "twine>=7.0.0",
]

[build-system]
requires = ["uv_build>=0.13.9,<0.14"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = "cignal"
module-root = "src"
source-include = ["tests/**", "CHANGELOG.md", "LICENSE"]

[tool.pytest.ini_options]
addopts = "-ra -q --strict-markers --strict-config"
testpaths = ["tests"]

[tool.mypy]
strict = true
files = ["src/cignal"]

[tool.ruff]
line-length = 120
src = ["src"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
# `type f32 = float` is not callable, and kernels call f32(x) at runtime.
ignore = ["UP040"]
